[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
version = "1.1.0"

[profile.release]
incremental = true

[profile.dist]
inherits = "release"
incremental = false
lto = "thin"
codegen-units = 1
strip = true
